<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="claude:viewport-fit-sides" content="cover">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one fullscreen WebGL stage; HUD, panels and controls float above it on glass. Single dark look by design. */
:root {
  --bg: #02040a;
  --cyan: #18e0ff;
  --orange: #ff6a10;
  --blue: #2a63ff;
  --accent: var(--cyan);
  --accent-soft: rgba(24, 224, 255, 0.12);
  --line: rgba(24, 224, 255, 0.28);
  --text: #d8f6ff;
  --muted: #7fa3b5;
  --danger: #ff4d5e;
  --ok: #3dffa8;
  --warn: #ffb02e;
  --glass: rgba(6, 18, 30, 0.66);
  --font-display: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
  --font-ui: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', Consolas, ui-monospace, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: env(safe-area-inset-top, 0px);
  --gb: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
.app[data-accent="orange"] { --accent: var(--orange); --accent-soft: rgba(255, 106, 16, 0.14); --line: rgba(255, 106, 16, 0.32); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
body { color: var(--text); font-family: var(--font-ui); font-size: 16px; -webkit-font-smoothing: antialiased; user-select: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input { font: inherit; color: inherit; }
.app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#trackVideo { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

/* overlays */
.fx { position: absolute; inset: 0; pointer-events: none; }
.fx-grid { background-image: linear-gradient(var(--accent-soft) 1px, transparent 1px), linear-gradient(90deg, var(--accent-soft) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse at center, transparent 30%, #000 55%, transparent 85%); mask-image: radial-gradient(ellipse at center, transparent 30%, #000 55%, transparent 85%); opacity: .35; }
.fx-scan { background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
.fx-bar { height: 18vh; top: -20vh; background: linear-gradient(to bottom, transparent, var(--accent-soft), transparent); animation: scanbar 7s linear infinite; opacity: .6; }
@keyframes scanbar { to { transform: translateY(140vh); } }
.fx-vig { background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.85) 100%); }
.fx-frame i { position: absolute; width: 40px; height: 40px; border: 2px solid var(--line); }
.fx-frame i:nth-child(1) { top: calc(12px + var(--gt)); left: calc(12px + env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 0; }
.fx-frame i:nth-child(2) { top: calc(12px + var(--gt)); right: calc(12px + env(safe-area-inset-right, 0px)); border-left: 0; border-bottom: 0; }
.fx-frame i:nth-child(3) { bottom: calc(12px + var(--gb)); left: calc(12px + env(safe-area-inset-left, 0px)); border-right: 0; border-top: 0; }
.fx-frame i:nth-child(4) { bottom: calc(12px + var(--gb)); right: calc(12px + env(safe-area-inset-right, 0px)); border-left: 0; border-top: 0; }
.reduced .fx-bar { display: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--line); background: rgba(4,16,26,.72); color: var(--text); font-family: var(--font-ui); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); transition: background .15s, border-color .15s, color .15s; }
.btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn-primary { background: var(--accent); color: #001018; border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: #fff; color: #001018; }
.btn-lg { padding: 14px 40px; font-size: 18px; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ghost { background: transparent; }
.btn-danger { border-color: rgba(255,77,94,.5); color: #ffb3bb; }
.btn em { font-style: normal; font-size: .75em; opacity: .6; }
.btn-cam.live { border-color: var(--danger); color: #ffc7cd; }
.rec { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.swatch i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* boot */
.boot { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding-inline: 16px; background: radial-gradient(circle at center, rgba(2,4,10,.35), rgba(2,4,10,.92) 70%); }
.boot-start { display: grid; justify-items: center; gap: 22px; text-align: center; }
.logo { font-family: var(--font-display); font-weight: 900; letter-spacing: .35em; padding-left: .35em; color: #fff; text-shadow: 0 0 18px var(--accent), 0 0 48px var(--accent); }
.boot .logo { font-size: clamp(48px, 13vw, 120px); }
.boot-opt { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; cursor: pointer; }
.boot-opt input { accent-color: var(--cyan); width: 18px; height: 18px; }
.note { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.boot-run { width: min(640px, 100%); display: grid; gap: 28px; }
.boot-lines { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.boot-lines li { padding: 3px 0; animation: typein .35s ease-out both; }
.boot-lines b { color: var(--ok); font-weight: 600; }
@keyframes typein { from { opacity: 0; transform: translateX(-12px); clip-path: inset(0 100% 0 0); } to { opacity: 1; transform: none; clip-path: inset(0); } }
.online { font-family: var(--font-display); font-weight: 700; text-align: center; font-size: clamp(20px, 5vw, 48px); letter-spacing: .22em; color: #fff; text-shadow: 0 0 20px var(--cyan), 0 0 60px var(--cyan); animation: online 1.2s ease-out both; text-wrap: balance; }
@keyframes online { from { opacity: 0; letter-spacing: .8em; filter: blur(8px); } to { opacity: 1; filter: none; } }
.boot-skip { justify-self: center; }

/* lock */
.lock { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.lock > * { pointer-events: auto; }
.lock-head { position: absolute; top: calc(7vh + var(--gt)); left: 0; right: 0; text-align: center; pointer-events: none; }
.lock .logo { --accent: var(--blue); font-size: clamp(40px, 10vw, 96px); }
.lock-sub { margin-top: 8px; font-family: var(--font-mono); letter-spacing: .3em; color: #9db9ff; font-size: 12px; display: inline-flex; align-items: center; gap: 10px; }
.dot-blue { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); animation: blink 2s infinite; }
.lock-ring { position: absolute; left: 50%; top: 50%; width: min(420px, 80vw); height: min(420px, 80vw); transform: translate(-50%, -50%) rotate(-90deg); pointer-events: none; }
.lock-ring .trk { fill: none; stroke: rgba(42,99,255,.22); stroke-width: 3; stroke-dasharray: 2 10; }
.lock-ring .fill { fill: none; stroke: var(--orange); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 8px var(--orange)); }
.lock-foot { position: absolute; left: 0; right: 0; bottom: calc(92px + var(--gb)); display: grid; justify-items: center; gap: 12px; padding-left: var(--gl); padding-right: var(--gr); text-align: center; }
.lock-instr { margin: 0; font-size: 17px; text-wrap: balance; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn-hold { min-width: 170px; justify-content: center; touch-action: none; }
.btn-hold:active { background: rgba(255,106,16,.25); border-color: var(--orange); }
.disclaimer { margin: 0; max-width: 620px; font-size: 13px; color: var(--muted); line-height: 1.4; }
.granted { display: grid; justify-items: center; align-content: end; padding-bottom: calc(18vh + var(--gb)); gap: 12px; text-align: center; }
.granted h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(24px, 6vw, 64px); letter-spacing: .18em; color: #fff; text-shadow: 0 0 20px var(--orange), 0 0 70px var(--orange); animation: granted 1.6s cubic-bezier(.2,.8,.2,1) both; text-wrap: balance; padding-inline: 12px; }
.granted p { margin: 0; color: #ffd2b0; font-family: var(--font-mono); letter-spacing: .2em; font-size: 12px; animation: online 1.4s .4s both; }
.burst { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%,-50%); border: 2px solid var(--orange); box-shadow: 0 0 40px var(--orange), inset 0 0 30px var(--orange); animation: burst 1.4s ease-out both; }
@keyframes granted { from { opacity: 0; transform: scale(1.4); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes burst { from { opacity: 1; width: 40px; height: 40px; } to { opacity: 0; width: 160vmax; height: 160vmax; } }
.reduced .granted h1, .reduced .burst, .reduced .online, .reduced .boot-lines li { animation-duration: .01s; }

/* HUD */
.hud { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(20px + var(--gt)) calc(var(--gr) + 18px) 0 calc(var(--gl) + 18px); }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand-mark { width: 13px; height: 13px; border: 2px solid var(--accent); transform: rotate(45deg); box-shadow: 0 0 10px var(--accent); align-self: center; }
.brand-name { font-family: var(--font-display); font-weight: 700; letter-spacing: .3em; font-size: 19px; }
.brand small { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.inds { display: flex; gap: 14px; align-items: center; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.ind { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); letter-spacing: .1em; }
.ind i { width: 8px; height: 8px; border-radius: 50%; background: #3a4a55; }
.ind.on { color: var(--ok); } .ind.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: blink 1.6s infinite; }
.ind.err { color: var(--danger); } .ind.err i { background: var(--danger); }
.ind.setup { color: var(--warn); } .ind.setup i { background: var(--warn); }
.ind.busy i { background: var(--accent); animation: blink .6s infinite; }
.title-mark { position: absolute; left: 50%; bottom: calc(150px + var(--gb)); transform: translateX(-50%); z-index: 2; pointer-events: none; font-size: clamp(28px, 4.4vw, 54px); opacity: .92; }
.chip { position: absolute; left: 50%; bottom: calc(96px + var(--gb)); transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 12px; padding: 6px 14px; background: var(--glass); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--muted); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; }
.chip.live { color: var(--text); border-color: var(--accent); }
.chip b { color: var(--accent); min-width: 84px; text-transform: uppercase; font-weight: 600; }
.chip .bar { width: 70px; height: 4px; background: rgba(255,255,255,.1); }
.chip .bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }

/* panels */
.panels { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.tabs { display: none; }
.panel { position: absolute; width: min(340px, 30vw); max-height: 62vh; display: flex; flex-direction: column; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: auto; transform: translate(var(--dx,0px), var(--dy,0px)) scale(var(--s,1)); transition: opacity .45s, transform .45s cubic-bezier(.2,.8,.2,1), border-color .2s, box-shadow .2s; clip-path: polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); z-index: 1; }
.panel.dragging { transition: opacity .45s, border-color .2s; }
.panel::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, var(--accent-soft), transparent 40%); }
.p-device { left: calc(var(--gl) + 2vw); top: calc(13vh + var(--gt)); transform-origin: left center; }
.p-system { right: calc(var(--gr) + 2vw); top: calc(13vh + var(--gt)); transform-origin: right top; }
.p-log { right: calc(var(--gr) + 2vw); bottom: calc(150px + var(--gb)); max-height: 28vh; transform-origin: right bottom; }
.p-voice { left: calc(var(--gl) + 2vw); bottom: calc(150px + var(--gb)); max-height: 38vh; transform-origin: left bottom; }
.p-device { max-height: calc(100vh - 13vh - 38vh - 190px); min-height: 180px; }
.chat { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 15vh; overflow: auto; font-size: 14px; line-height: 1.35; user-select: text; -webkit-user-select: text; }
.chat li { padding: 6px 8px; background: rgba(0,0,0,.25); border-left: 2px solid var(--line); }
.chat li.you { border-color: var(--orange); }
.chat li b { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.v-row { justify-content: flex-start; align-items: center; }
.v-form { display: flex; gap: 8px; min-width: 0; }
.v-form input { flex: 1; min-width: 0; padding: 8px 10px; background: #06121c; border: 1px solid var(--line); color: var(--text); font-size: 15px; user-select: text; -webkit-user-select: text; }
.v-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.teach { border: 1px solid var(--line); background: rgba(0,0,0,.2); }
.teach summary { cursor: pointer; padding: 8px 10px; font-family: var(--font-display); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.teach summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.teach > .note { padding: 0 10px; }
.teach-form { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; padding: 4px 10px 8px; min-width: 0; }
.teach-form label { font-size: 13px; color: var(--muted); }
.teach-form input { min-width: 0; padding: 7px 9px; background: #06121c; border: 1px solid var(--line); color: var(--text); font-size: 15px; user-select: text; -webkit-user-select: text; }
.teach-form .btn { grid-column: 2; justify-self: start; }
.taught { list-style: none; margin: 0; padding: 6px 10px 10px; display: grid; gap: 4px; font-size: 13px; }
.taught li { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px dashed rgba(255,255,255,.07); padding-bottom: 3px; }
.taught li span { min-width: 0; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.taught li.empty { color: var(--muted); }
.panel.active { border-color: var(--accent); box-shadow: 0 0 24px var(--accent-soft); z-index: 2; }
.panel.sel { box-shadow: 0 0 0 2px var(--orange), 0 0 30px rgba(255,106,16,.35); z-index: 3; }
.panels.collapsed .panel { opacity: 0; pointer-events: none; }
.p-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: grab; touch-action: none; }
.p-head:active { cursor: grabbing; }
.p-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
.p-idx { font-family: var(--font-mono); color: var(--accent); font-size: 12px; }
.p-grip { color: var(--muted); letter-spacing: -2px; }
.p-body { padding: 12px 14px 14px; overflow: auto; display: grid; gap: 10px; min-width: 0; }
.devs { display: grid; gap: 8px; }
.dev { padding: 10px; border: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.25); display: grid; gap: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
.dev:hover, .dev:focus-visible { border-color: var(--line); outline: none; }
.dev.sel { border-color: var(--orange); background: rgba(255,106,16,.08); }
.dev-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dev-icon { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.5; flex: none; }
.dev-meta { flex: 1; min-width: 0; }
.dev-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); }
.dev-status i { width: 7px; height: 7px; border-radius: 50%; background: #5a6670; }
.dev.connected .dev-status i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.dev-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; padding: 2px 6px; border: 1px solid rgba(255,176,46,.5); color: var(--warn); background: rgba(255,176,46,.08); flex: none; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-bottom: 1px dashed rgba(255,255,255,.07); padding-bottom: 5px; }
.kv span { color: var(--muted); }
.kv b { font-family: var(--font-mono); font-weight: 600; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-err { color: var(--danger); } .t-dim { color: #61727d; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
.log li { display: flex; gap: 8px; align-items: baseline; }
.log time { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.src { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; padding: 0 4px; border: 1px solid var(--line); color: var(--accent); }
.src.system { color: var(--muted); border-color: #2a3a44; }
.src.touch, .src.keyboard, .src.typed { color: #b7c7ff; border-color: #34406e; }
.src.voice { color: var(--orange); border-color: rgba(255,106,16,.45); }

/* controls */
.controls { position: absolute; left: 50%; bottom: calc(20px + var(--gb)); transform: translateX(-50%); z-index: 8; display: flex; gap: 8px; align-items: center; padding: 8px; max-width: calc(100% - 32px); overflow-x: auto; background: rgba(2,8,14,.78); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); scrollbar-width: none; }
.controls::-webkit-scrollbar { display: none; }
.sel-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.sel-wrap select { background: #06121c; border: 1px solid var(--line); padding: 6px 8px; font-size: 13px; color: var(--text); }

/* cursor, preview, banners */
.cursor { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; width: 0; height: 0; opacity: 0; transition: opacity .2s; --hold: 0; }
.cursor .dot { position: absolute; width: 12px; height: 12px; left: -6px; top: -6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); transition: transform .12s, background .12s; }
.cursor .ring { position: absolute; width: 46px; height: 46px; left: -23px; top: -23px; border-radius: 50%; border: 1px solid var(--line); background: conic-gradient(var(--orange) calc(var(--hold) * 360deg), transparent 0); -webkit-mask: radial-gradient(circle, transparent 19px, #000 20px); mask: radial-gradient(circle, transparent 19px, #000 20px); }
.cursor.pinch .dot { background: var(--orange); box-shadow: 0 0 18px var(--orange); transform: scale(.7); }
.cursor.spread .dot { transform: scale(1.8); }
.preview { position: absolute; right: calc(var(--gr) + 6px); bottom: calc(96px + var(--gb)); z-index: 7; margin: 0; border: 1px solid var(--line); background: #000; }
.preview canvas { display: block; width: 240px; height: 180px; max-width: 100%; }
.preview figcaption { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.bstack { position: absolute; top: calc(70px + var(--gt)); left: 50%; transform: translateX(-50%); z-index: 25; display: grid; gap: 8px; justify-items: center; width: max-content; max-width: calc(100% - 32px); }
.app[data-phase="locked"] .bstack { top: calc(25vh + var(--gt)); }

<script type="importmap">
{ "imports": {

<script type="module">
// ULTON — single-file web edition (Phase A)
// Webcam frames are analysed in this browser tab only; nothing is recorded or uploaded.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const MP_VERSION = '0.10.14';

const MODEL_REMOTE = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = (sel) => document.querySelector(sel);

/* ───────────────────────── settings & state ───────────────────────── */
const SETTINGS_KEY = 'ulton.web.settings.v1';
const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) || matchMedia('(pointer: coarse)').matches;

const defaults = {

  accent: 'cyan',

  wakeWord: true,
  autoListen: true,
  cameraId: '',
};
let saved = {};
try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; } catch { saved = {}; }

const S = {
  ...defaults,
  ...saved,
  phase: 'boot',
  effQ: 'medium',
  expanded: true,
  orbScale: 1,
  panels: [
    { id: 'device', title: 'This Device', dx: 0, dy: 0, scale: 1 },
    { id: 'system', title: 'System', dx: 0, dy: 0, scale: 1 },
    { id: 'log', title: 'Gesture Log', dx: 0, dy: 0, scale: 1 },
    { id: 'voice', title: 'Voice & Chat', dx: 0, dy: 0, scale: 1 },

  selPanel: null,

S.effQ = S.quality === 'auto' ? initialQuality() : S.quality;

function saveSettings() {
  const out = {};
  for (const k of Object.keys(defaults)) out[k] = S[k];
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(out)); } catch { /* storage blocked */ }
}

/* per-frame hand data (not part of UI renders) */
const RT = { present: false, cx: 0.5, cy: 0.5, pinching: false, spread: false, hold: 0, flash: 0, landmarks: [] };

/* ───────────────────────── sound & speech ───────────────────────── */
let actx = null, master = null;
function initAudio() {
  if (actx) { actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = 0.35;
  master.connect(actx.destination);
}
function tone(f, dur, type = 'sine', gain = 0.4, endF, delay = 0) {
  if (!actx || !S.sound) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (endF) o.frequency.exponentialRampToValueAtTime(endF, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(master);
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}
function noise(dur, from, to, gain = 0.25) {
  if (!actx || !S.sound) return;
  const t0 = actx.currentTime, len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
  f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(master); src.start(t0);
}
const sfx = {
  boot() { tone(55, 2.2, 'sawtooth', 0.12, 110); tone(110, 2.2, 'sine', 0.2, 220); },
  online() { tone(440, 0.18, 'triangle', 0.25); tone(660, 0.25, 'triangle', 0.25, null, 0.12); tone(880, 0.5, 'sine', 0.2, null, 0.24); },
  unlock() { noise(1.1, 300, 4000, 0.3); tone(120, 1.4, 'sawtooth', 0.15, 480); tone(523, 0.6, 'sine', 0.25, null, 0.9); tone(784, 0.9, 'sine', 0.22, null, 1.05); },
  blip(hi) { tone(hi ? 1200 : 760, 0.09, 'square', 0.08); },
  swoosh() { noise(0.35, 800, 3000, 0.15); },
  connect() { tone(330, 0.15, 'triangle', 0.2); tone(495, 0.3, 'triangle', 0.2, null, 0.1); },

let ttsActive = false, ttsEndedAt = 0;
const speakingNow = () => ttsActive || performance.now() - ttsEndedAt < 500;
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const synth = window.speechSynthesis;
  const run = () => {
    const u = new SpeechSynthesisUtterance(text);
    const en = synth.getVoices().filter((v) => v.lang.toLowerCase().startsWith('en'));
    const v = en.find((x) => /male|david|daniel|guy/i.test(x.name)) || en.find((x) => /en-(us|gb)/i.test(x.lang)) || en[0];
    if (v) u.voice = v;
    u.rate = 0.95; u.pitch = 0.75;
    u.onstart = () => { ttsActive = true; };
    u.onend = u.onerror = () => { ttsActive = false; ttsEndedAt = performance.now(); };
    synth.cancel(); synth.speak(u);
  };
  if (synth.getVoices().length) run();
  else { let done = false; const once = () => { if (done) return; done = true; run(); }; synth.addEventListener('voiceschanged', once, { once: true }); setTimeout(once, 600); }
}

/* ───────────────────────── actions ───────────────────────── */
let nextId = 1;
function log(label, source = 'gesture') {
  S.log = [{ id: nextId++, label, source, t: Date.now() }, ...S.log].slice(0, 14);
  if (S.phase === 'unlocked') renderPanelBodies();
}
function toast(text, tone = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${tone}`;
  el.textContent = text;
  const box = $('#toasts');
  box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => el.remove(), 3800);
}
function flash(a = 1) { RT.flash = Math.max(RT.flash, a); }

function setExpanded(v, src) {
  if (S.expanded === v) return;
  S.expanded = v;
  if (!v) S.selPanel = null;
  flash(0.8); sfx.swoosh();
  log(v ? 'Open palm → expand interface' : 'Fist → collapse interface', src);
  layoutPanels(); renderControls();
}
function switchPanel(dir, src) {
  S.active = (S.active + dir + S.panels.length) % S.panels.length;
  S.expanded = true;
  flash(0.5); sfx.blip(dir > 0);
  log(`Swipe ${dir > 0 ? 'right' : 'left'} → ${S.panels[S.active].title}`, src);
  layoutPanels();
}
function setOrbScale(v) { S.orbScale = clamp(v, 0.5, 2.2); }
function scalePanel(id, v) { const p = S.panels.find((x) => x.id === id); if (p) { p.scale = clamp(v, 0.6, 1.8); layoutPanels(); } }

  layoutPanels();
}
function lockUI(src) {
  S.phase = 'locked'; S.unlockProgress = 0; S.selPanel = null;
  log('Interface locked', src);
  renderAll();
}
let unlockTimer = 0;
function startUnlock(src) {
  if (S.phase !== 'locked') return;
  S.phase = 'unlocking'; S.unlockProgress = 1;
  flash(1); sfx.unlock();
  log('ULTON access granted (app-level unlock)', src);
  renderAll();
  clearTimeout(unlockTimer);

}

  S[k] = v;

  if (k === 'reduced') $('#app').classList.toggle('reduced', v);

/* ───────────────────────── 3D scene ───────────────────────── */
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;
const ORB_VS = `uniform float uTime; uniform float uEnergy; varying vec3 vNormal; varying vec3 vView; varying float vNoise;
${NOISE}
void main(){
  float n=snoise(normal*1.6+vec3(uTime*0.35)); float n2=snoise(normal*4.2-vec3(uTime*0.7))*0.35;
  vec3 pos=position+normal*(n+n2)*(0.05+uEnergy*0.16); vNoise=n+n2;
  vec4 mv=modelViewMatrix*vec4(pos,1.0); vNormal=normalize(normalMatrix*normal); vView=normalize(-mv.xyz);
  gl_Position=projectionMatrix*mv;
}`;
const ORB_FS = `uniform vec3 uColor; uniform vec3 uAccent; uniform float uEnergy; uniform float uFlash; uniform float uTime;
varying vec3 vNormal; varying vec3 vView; varying float vNoise;
void main(){
  float fres=pow(1.0-max(dot(vNormal,vView),0.0),2.4);
  float bands=0.5+0.5*sin(vNoise*14.0+uTime*2.2);
  float veins=smoothstep(0.82,1.0,bands)*(0.5+uEnergy);
  vec3 col=uColor*(0.18+0.25*bands)+uColor*fres*(1.8+uEnergy*1.5)+mix(uColor,vec3(1.0),0.4)*veins*0.9+uAccent*uFlash*(0.5+fres*1.5);
  gl_FragColor=vec4(col,clamp(0.35+fres*0.9+veins*0.3,0.0,1.0));
}`;
const PT_VS = `attribute float aRadius; attribute float aAngle; attribute float aSpeed; attribute float aTilt; attribute float aSize; attribute float aSeed;
uniform float uTime; uniform vec3 uHand; uniform float uHandStrength; uniform float uSpread; uniform float uPixelRatio; uniform float uEnergy;
varying float vAlpha;
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.0,0.0,0.0,0.0,c,s,0.0,-s,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.0,-s,c,0.0,0.0,0.0,1.0);}
void main(){
  float a=aAngle+uTime*aSpeed*(1.0+uEnergy);
  float r=aRadius*uSpread*(1.0+0.06*sin(uTime*1.3+aSeed*6.2831));
  vec3 p=vec3(cos(a)*r,sin(uTime*0.7+aSeed*20.0)*0.08,sin(a)*r);
  p=rotZ(aSeed*3.1416)*(rotX(aTilt)*p);

  vAlpha=(0.35+0.65*fract(aSeed*13.7))*(0.6+uEnergy*0.6+f);
}`;
const PT_FS = `uniform vec3 uColor; varying float vAlpha;
void main(){ float d=length(gl_PointCoord-0.5); gl_FragColor=vec4(uColor*1.6,smoothstep(0.5,0.0,d)*vAlpha); }`;

const Q = {
  dpr: { low: 1, medium: 1.5, high: 2 },
  particles: { low: 900, medium: 2600, high: 6000 },
  seg: { low: 48, medium: 96, high: 144 },
  detectFps: { low: 15, medium: 24, high: 30 },

const BLUE = new THREE.Color('#2a63ff'), CYAN = new THREE.Color('#18e0ff'), ORANGE = new THREE.Color('#ff6a10');
const damp = THREE.MathUtils.damp;
const canvas = $('#stage');
let renderer;

}

const addUnit = (names, kind, factor) => names.forEach((n) => { UNITS[n] = { kind, factor, name: names[0] }; });

const TEMP = { celsius: 'C', c: 'C', centigrade: 'C', fahrenheit: 'F', f: 'F', kelvin: 'K', k: 'K' };
function convertUnits(t) {
  const m = t.toLowerCase().replace(/°/g, ' ').match(/(-?\d+(?:\.\d+)?)\s*(?:degrees?\s+)?([a-z]+)\s+(?:to|in|into|mein)\s+(?:degrees?\s+)?([a-z]+)/);
  if (!m) return null;
  const v = parseFloat(m[1]), a = m[2], b = m[3];
  if (TEMP[a] && TEMP[b]) {
    const toC = { C: (x) => x, F: (x) => (x - 32) * 5 / 9, K: (x) => x - 273.15 }[TEMP[a]](v);
    const out = { C: toC, F: toC * 9 / 5 + 32, K: toC + 273.15 }[TEMP[b]];
    return `${v}°${TEMP[a]} is ${Math.round(out * 100) / 100}°${TEMP[b]}.`;
  }
  const ua = UNITS[a], ub = UNITS[b];
  if (!ua || !ub || ua.kind !== ub.kind) return null;
  const out = (v * ua.factor) / ub.factor;
  return `${v} ${ua.name} is ${Math.round(out * 1000) / 1000} ${ub.name}.`;
}

/* ---- questions and everything else ---- */
const QUESTION = /^(?:who|what|where|when|why|how|which|tell me|explain|define|is|are|can|does|do|kya|kaun|kahan|kab|kyun|kaise)\b|\b(?:kya hai|kya hota hai|kaun hai|kaun tha|kaun thi|ke baare mein|ke bare me|ke bare mein|batao|samjhao)\b/i;
function topicOf(q) {
  return q
    .replace(/^(?:tell me|explain|search wikipedia for|what do you know)\s+(?:about\s+)?/i, '')
    .replace(/^(?:who|what|where)\s+(?:is|was|are|were)\s+(?:the\s+|a\s+|an\s+)?/i, '')
    .replace(/\s+(?:kya hai|kya hota hai|kaun hai|kaun tha|kaun thi|ke baare mein batao|ke bare me batao|ke bare mein batao|ke baare mein|ke bare me|ke bare mein|batao|samjhao)$/i, '')
    .replace(/\?+$/, '')
    .trim();
}
async function answerQuestion(clean, t) {
  const calc = parseMath(t);
  if (calc !== null) { reply(`That’s ${calc.toLocaleString('en-IN', { maximumFractionDigits: 6 })}.`); return; }
  const conv = convertUnits(t);
  if (conv) { reply(conv); return; }

  if (/\b(weather|temperature|mausam|forecast)\b/.test(t)) {
    const m = t.match(/\b(?:in|at|of|for)\s+([a-z][a-z .-]*?)(?:\s+(?:today|now|right now|please))?$/) || t.match(/^([a-z][a-z .-]*?)\s+(?:ka|ki|mein|mai|me|main)\s+(?:aaj\s+)?(?:ka\s+)?(?:mausam|weather|temperature)/);
    const city = ((m && m[1].trim()) || (lookupFact('my city') || {}).value || '').replace(/\b[a-z]/g, (c) => c.toUpperCase());
    if (!city) { reply('Which city? Say “weather in Delhi”, or teach me: “remember that my city is Delhi”.'); return; }
    if (!canFetch()) { await viaAIOr(clean, embedded ? 'Live weather works on your own ULTON site, not inside Claude.' : 'I need an internet connection for the weather.'); return; }
    const id = addChat('ulton', 'Checking the weather…');
    const w = await weatherFor(city);
    removeChat(id);
    reply(w || `I couldn’t find the weather for ${city}.`);
    return;
  }

  const dm = t.match(/^(?:define|meaning of|what is the meaning of|what does)\s+([a-z-]+)(?:\s+mean)?$/);
  if (dm && canFetch()) {
    const id = addChat('ulton', 'Looking it up…');
    const d = await defineWord(dm[1]);
    removeChat(id);
    if (d) { reply(d); return; }
  }

  const my = clean.match(/^(?:what(?:'s|’s|\s+is|\s+are)|who(?:'s|’s|\s+is))\s+(my\s+.+?)\??$/i);
  if (my && !(await getAI())) { reply(`I don’t know ${youify(my[1])} yet. Teach me: “remember that ${my[1]} is …”.`); return; }

  // Inside Claude: a real AI answer. On your own site: Wikipedia.
  if (await getAI()) {
    const id = addChat('ulton', 'Thinking…');
    const a = await askAI(clean);
    removeChat(id);
    if (a) { reply(a); return; }
  }
  if ((QUESTION.test(clean) || clean.split(/\s+/).length <= 4) && canFetch()) {
    const topic = topicOf(clean);
    if (topic) {
      const id = addChat('ulton', 'Searching Wikipedia…');
      const w = await wikiAnswer(topic);
      removeChat(id);
      if (w) { reply(w.text); toastLink('Wikipedia:', w.url, 'Read more'); return; }
    }
  }
  reply('I don’t know that yet.',
    `You can teach me: “remember that X is Y”, or “when I say X, say Y”.${canFetch() ? '' : embedded ? ' Online answers work on your own ULTON site.' : ' Connect to the internet for Wikipedia answers.'}`);
  if (!embedded) actionButton(`Google “${clean}”`, `https://www.google.com/search?q=${encodeURIComponent(clean)}`);
}
async function viaAIOr(clean, msg) {
  if (await getAI()) { const id = addChat('ulton', 'Thinking…'); const a = await askAI(clean); removeChat(id); if (a) { reply(a); return; } }
  reply(msg);
}
let busy = Promise.resolve();
function handleCommand(raw, src) {
  // one message at a time, in order
  busy = busy.then(() => think(raw, src)).catch((e) => console.error(e));
  return busy;
}
async function think(raw, src) {
  const text = String(raw).trim();
  if (!text) return;
  addChat('you', text, src);
  const clean = cleanText(text);
  const t = normalizeCommand(text);
  if (!t) { reply(`Yes, ${USER_NAME}? How can I help?`); return; }
  const taught = MEM.replies[memKey(clean)];
  if (taught) { reply(taught.value); return; }
  for (const h of MEMORY_HANDLERS) {
    const m = clean.match(h.re);
    if (m && (!h.test || h.test(m))) { h.run(m); return; }
  }
  for (const c of COMMANDS) {
    const m = t.match(c.re);
    if (m && (!c.test || c.test(m))) { await c.run(m, src, clean); return; }
  }
  await answerQuestion(clean, t);
}

canvas.addEventListener('pointerdown', (e) => { if (touches.size <= 1) swipeStart = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!swipeStart || S.phase !== 'unlocked' || touches.size > 0 || wasMulti) { swipeStart = null; return; }
  const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y, dt = performance.now() - swipeStart.t;
  if (Math.abs(dx) > 80 && Math.abs(dy) < Math.abs(dx) * 0.6 && dt < 500) switchPanel(dx > 0 ? 1 : -1, 'touch');
  swipeStart = null;
});

// Cleanup on close
window.addEventListener('pagehide', () => {
  stopCamera();
  wantListen = false; try { rec && rec.abort(); } catch { /* ignore */ }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (actx) actx.close();
  landmarkerP?.then((l) => l.close()).catch(() => {});
});

/* ───────────────────────── install as a phone app ───────────────────────── */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const canInstall = () => !embedded && !isStandalone();
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; renderControls(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('ULTON is installed. Open it from your home screen.', 'ok'); renderControls(); });
if (!embedded && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => { /* offline support is optional */ });
}
async function installApp() {
  if (installEvt) {
    installEvt.prompt();
    const choice = await installEvt.userChoice.catch(() => null);
    installEvt = null;
    if (choice && choice.outcome === 'accepted') toast('Installing ULTON…', 'ok');
    renderControls();
    return;
  }
  S.help = true; renderHelp();
  setTimeout(() => $('#installSec')?.scrollIntoView({ block: 'start' }), 50);
}

/* ───────────────────────── start ───────────────────────── */
$('#app').dataset.accent = S.accent;
$('#app').classList.toggle('reduced', S.reduced);
applyQuality();
renderAll();
requestAnimationFrame(frame);

</script>
